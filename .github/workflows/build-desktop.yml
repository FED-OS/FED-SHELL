name: Build EXE

# Builds the Surf FED Electron browser into a portable Windows EXE
# and optional macOS / Linux packages using electron-builder.
#
# Built-in extensions under extensions/builtin/ are included automatically
# because they are listed in package.json -> build.files.
#
# Triggers:
#   - push to main      -> build + upload artifact, no release
#   - manual run        -> build + upload artifact, no release
#   - pushing a v* tag  -> build + publish a GitHub Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary target.
        # The runner versions are pinned to avoid unexpected changes from
        # the moving *-latest labels.
        os:
          - windows-2022
          - macos-14
          - ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Install dependencies
        run: npm install

      # Verify that each bundled extension has a valid manifest before
      # packaging it into any release artifact.
      - name: Validate built-in extensions
        shell: bash
        run: |
          set -e

          if [ ! -d extensions/builtin ]; then
            echo "No builtin extensions folder found."
            exit 0
          fi

          ok=1

          for dir in extensions/builtin/*/; do
            if [ ! -f "${dir}manifest.json" ]; then
              echo "::error::Missing manifest.json in $dir"
              ok=0
              continue
            fi

            if ! node -e "JSON.parse(require('fs').readFileSync('${dir}manifest.json', 'utf8'))" 2>/dev/null; then
              echo "::error::Invalid JSON in ${dir}manifest.json"
              ok=0
            else
              name=$(node -e "console.log(JSON.parse(require('fs').readFileSync('${dir}manifest.json', 'utf8')).name || 'unknown')")
              ver=$(node -e "console.log(JSON.parse(require('fs').readFileSync('${dir}manifest.json', 'utf8')).version || '0')")
              echo "OK: $name v$ver ($dir)"
            fi
          done

          [ "$ok" = "1" ] || exit 1

      # Ubuntu 24.04 uses libasound2t64 instead of the former libasound2
      # package name.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libnotify-dev \
            libnss3 \
            libxss1 \
            libxtst6 \
            xauth \
            libavcodec-extra \
            libgbm1 \
            libasound2t64

      - name: Build Windows portable EXE
        if: runner.os == 'Windows'
        run: npm run dist -- --win --publish never

      - name: Build macOS package
        if: runner.os == 'macOS'
        run: npm run dist -- --mac --publish never

      - name: Build Linux package
        if: runner.os == 'Linux'
        run: npm run dist -- --linux --publish never

      # Upload all supported outputs generated by electron-builder.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Surf-FED-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.snap
            dist/latest*.yml
          if-no-files-found: ignore
          retention-days: 30

  # Only runs after every matrix build passes and only for a v* tag push.
  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts into a single folder
        shell: bash
        run: |
          mkdir -p release

          find artifacts -type f \
            \( \
              -name '*.exe' -o \
              -name '*.dmg' -o \
              -name '*.AppImage' -o \
              -name '*.deb' -o \
              -name '*.snap' -o \
              -name 'latest*.yml' \
            \) \
            -exec cp {} release/ \;

          echo "Release files:"
          ls -lah release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Surf FED ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
