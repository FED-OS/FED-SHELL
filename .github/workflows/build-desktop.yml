name: Build Desktop (Electron)

# ──────────────────────────────────────────────────────────────────────────────
# FED-Shell — Desktop-only Electron build pipeline
#
# Builds Windows (NSIS installer), macOS (DMG), and Linux (AppImage + deb)
# in parallel using electron-builder. Runs on push to main, on v* tags, and
# manually via workflow_dispatch.
#
# This is the desktop-focused companion to build-all.yml. If build-all.yml
# is present it already includes these desktop jobs; this file is provided
# so that either workflow can run standalone.
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target_url:
        description: '🔗 Target URL (overrides default)'
        required: false
        type: string
      app_name:
        description: '📱 App display name (overrides default)'
        required: false
        default: 'FED Shell'
        type: string
      app_id:
        description: '🆔 Reverse-domain app ID (overrides default)'
        required: false
        default: 'com.fed.shell'
        type: string

permissions:
  contents: read

env:
  TARGET_URL: ${{ github.event.inputs.target_url || 'https://your-default-url.com' }}
  APP_NAME: ${{ github.event.inputs.app_name || 'FED Shell' }}
  APP_ID: ${{ github.event.inputs.app_id || 'com.fed.shell' }}

jobs:
  build-desktop:
    name: Desktop Electron (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
          - os: macos-14
            platform: mac
          - os: ubuntu-24.04
            platform: linux
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Inject URL into config.json
        shell: bash
        run: |
          chmod +x scripts/inject-url.sh || true
          ./scripts/inject-url.sh "$TARGET_URL" "$APP_NAME" "$APP_ID" || echo "No inject script, skipping"

      - name: Install dependencies
        run: npm install

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libnotify-dev libnss3 libxss1 libxtst6 \
            xauth libavcodec-extra libgbm1 libasound2t64

      - name: Validate built-in extensions
        shell: bash
        run: |
          set -e
          if [ ! -d extensions/builtin ]; then
            echo "No builtin extensions folder found."
            exit 0
          fi
          ok=1
          for dir in extensions/builtin/*/; do
            if [ ! -f "${dir}manifest.json" ]; then
              echo "::error::Missing manifest.json in $dir"
              ok=0
              continue
            fi
            if ! node -e "JSON.parse(require('fs').readFileSync('${dir}manifest.json', 'utf8'))" 2>/dev/null; then
              echo "::error::Invalid JSON in ${dir}manifest.json"
              ok=0
            else
              name=$(node -e "console.log(JSON.parse(require('fs').readFileSync('${dir}manifest.json', 'utf8')).name || 'unknown')")
              ver=$(node -e "console.log(JSON.parse(require('fs').readFileSync('${dir}manifest.json', 'utf8')).version || '0')")
              echo "OK: $name v$ver ($dir)"
            fi
          done
          [ "$ok" = "1" ] || exit 1

      - name: Build desktop installer
        run: npm run dist -- --${{ matrix.platform }} --publish never

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: FED-Shell-Electron-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.snap
            dist/latest*.yml
          if-no-files-found: warn
          retention-days: 30
