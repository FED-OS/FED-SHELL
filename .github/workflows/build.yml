name: Build Mobile Apps (Android + iOS) + Desktop Electron

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-desktop:
    name: Desktop Electron (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            os: windows-2022

          - platform: mac
            os: macos-latest

          - platform: linux
            os: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libnotify-dev \
            libnss3 \
            libxss1 \
            libxtst6 \
            xauth \
            libavcodec-extra \
            libgbm1 \
            libasound2t64

      - name: Build Windows installer
        if: matrix.platform == 'win'
        run: npm run dist -- --win --publish never

      - name: Build macOS installer
        if: matrix.platform == 'mac'
        run: npm run dist -- --mac --publish never

      - name: Build Linux installers
        if: matrix.platform == 'linux'
        run: npm run dist -- --linux --publish never

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: fed-shell-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm ci

      - name: Sync web assets into Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APKs
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APKs
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apks
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apks
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  build-ios-simulator:
    name: Build iOS app (Simulator)
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Sync web assets into iOS
        run: npx cap sync ios

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: app-ios-simulator
          path: build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
