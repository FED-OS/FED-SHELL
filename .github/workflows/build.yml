name: Build Desktop (Electron) + Mobile

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    # Optional manual inputs (you can add URL, app name, etc.)
    inputs:
      target_url:
        description: 'Target URL (overrides default)'
        required: false
        type: string
      app_name:
        description: 'App display name (overrides default)'
        required: false
        default: 'Surf FED'
        type: string

env:
  # Default values – can be overridden by workflow_dispatch inputs
  TARGET_URL: ${{ github.event.inputs.target_url || 'https://your-default-url.com' }}
  APP_NAME: ${{ github.event.inputs.app_name || 'Surf FED' }}
  APP_ID: 'com.fed.surf'   # Adjust as needed

jobs:
  # ================================================================
  # DESKTOP ELECTRON BUILDS (Windows, macOS, Linux)
  # ================================================================
  build-desktop-electron:
    name: Desktop Electron (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - macos-14
          - ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Install dependencies
        run: npm install

      # Validate built-in extensions (from your build.yml)
      - name: Validate built-in extensions
        shell: bash
        run: |
          set -e
          if [ ! -d extensions/builtin ]; then
            echo "No builtin extensions folder found."
            exit 0
          fi
          ok=1
          for dir in extensions/builtin/*/; do
            if [ ! -f "${dir}manifest.json" ]; then
              echo "::error::Missing manifest.json in $dir"
              ok=0
              continue
            fi
            if ! node -e "JSON.parse(require('fs').readFileSync('${dir}manifest.json', 'utf8'))" 2>/dev/null; then
              echo "::error::Invalid JSON in ${dir}manifest.json"
              ok=0
            else
              name=$(node -e "console.log(JSON.parse(require('fs').readFileSync('${dir}manifest.json', 'utf8')).name || 'unknown')")
              ver=$(node -e "console.log(JSON.parse(require('fs').readFileSync('${dir}manifest.json', 'utf8')).version || '0')")
              echo "OK: $name v$ver ($dir)"
            fi
          done
          [ "$ok" = "1" ] || exit 1

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libnotify-dev libnss3 libxss1 libxtst6 \
            xauth libavcodec-extra libgbm1 libasound2t64

      - name: Build Windows portable EXE
        if: runner.os == 'Windows'
        run: npm run dist -- --win --publish never

      - name: Build macOS package
        if: runner.os == 'macOS'
        run: npm run dist -- --mac --publish never

      - name: Build Linux package
        if: runner.os == 'Linux'
        run: npm run dist -- --linux --publish never

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Surf-FED-Electron-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.snap
            dist/latest*.yml
          if-no-files-found: ignore
          retention-days: 30

  # ================================================================
  # ANDROID BUILDS (Debug APKs, Release APKs, AAB)
  # ================================================================
  build-android-debug:
    name: Android Debug APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      # If you have an inject-url.sh script, use it; otherwise skip or adapt
      - run: chmod +x scripts/inject-url.sh || true
      - run: ./scripts/inject-url.sh "$TARGET_URL" "$APP_NAME" "$APP_ID" || echo "No inject script, skipping"
      - run: npm ci
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apks
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-android-release:
    name: Android Release APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: chmod +x scripts/inject-url.sh || true
      - run: ./scripts/inject-url.sh "$TARGET_URL" "$APP_NAME" "$APP_ID" || echo "No inject script, skipping"
      - run: npm ci
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apks
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  build-android-bundle:
    name: Android Release AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: chmod +x scripts/inject-url.sh || true
      - run: ./scripts/inject-url.sh "$TARGET_URL" "$APP_NAME" "$APP_ID" || echo "No inject script, skipping"
      - run: npm ci
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  # ================================================================
  # iOS SIMULATOR BUILD
  # ================================================================
  build-ios-simulator:
    name: iOS Simulator .app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: chmod +x scripts/inject-url.sh || true
      - run: ./scripts/inject-url.sh "$TARGET_URL" "$APP_NAME" "$APP_ID" || echo "No inject script, skipping"
      - run: npm ci
      - run: npx cap sync ios
      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error

  # ================================================================
  # OPTIONAL: PUBLISH GITHUB RELEASE (only when a v* tag is pushed)
  # ================================================================
  release:
    name: Publish GitHub Release
    needs: [build-desktop-electron, build-android-debug, build-android-release, build-android-bundle, build-ios-simulator]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts into release folder
        shell: bash
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          echo "Release files:"
          ls -lah release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Surf FED ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ================================================================
  # OPTIONAL: GATHER ALL ARTIFACTS INTO ONE ZIP
  # ================================================================
  package-all:
    name: Gather All Builds (optional)
    if: always()
    needs:
      - build-desktop-electron
      - build-android-debug
      - build-android-release
      - build-android-bundle
      - build-ios-simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all-builds
      - name: Create unified zip
        run: |
          cd all-builds
          zip -r ../Surf-FED-All-Platforms.zip . || true
      - uses: actions/upload-artifact@v4
        with:
          name: Surf-FED-All-Platforms
          path: Surf-FED-All-Platforms.zip
          if-no-files-found: warn
