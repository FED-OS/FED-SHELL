<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark light" />
    <title>web2apk</title>
    <link rel="stylesheet" href="popup.css" />
  <script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
  <body>
    <header class="head">
      <img src="../icons/icon-48.png" alt="" class="logo" width="28" height="28" />
      <div class="titles">
        <strong id="app-name">My Web App</strong>
        <span id="app-host">example.com</span>
      </div>
      <button id="btn-options" class="icon-btn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.56-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.08a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.56h.08a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.08a1.7 1.7 0 0 0 1.56 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.56 1z" />
        </svg>
      </button>
    </header>

    <main>
      <button id="btn-open" class="primary" title="Open your web app">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14M13 6l6 6-6 6" />
        </svg>
        Open app
      </button>

      <div class="row two">
        <button id="btn-window" class="ghost" title="Open in a standalone app window">App window</button>
        <button id="btn-tab" class="ghost" title="Open in a normal tab">New tab</button>
      </div>

      <section class="status" id="status" hidden>
        <span class="dot" id="status-dot"></span>
        <span id="status-text">—</span>
        <span class="spacer"></span>
        <time id="status-when"></time>
      </section>

      <section id="quick" hidden>
        <h2>Quick links</h2>
        <div class="links" id="quick-links"></div>
      </section>

      <section id="recents" hidden>
        <h2>Recent</h2>
        <ul class="recents" id="recent-list"></ul>
      </section>
    </main>

    <footer>
      <span id="version" class="muted"></span>
      <span class="spacer"></span>
      <button id="btn-dashboard" class="link-btn">Dashboard</button>
    </footer>

    <script src="../common.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
